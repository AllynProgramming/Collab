<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Merz Beauty Glow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/landing.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-header">
    <img src="Asset/logo.png" alt="Merz Beauty Glow Salon and Spa" class="auth-logo">
    <h2 class="form-title">Welcome Back</h2>
  </div>

  <form class="auth-form">
    <div class="form-group">
      <label>Mobile Number or Email</label>
      <input type="text" placeholder="0917XXXXXXX or name@email.com" required />
    </div>

    <div class="form-group">
      <div class="label-row">
        <label>Password</label>
        <a href="#forgot" class="link-muted">Forgot Password?</a>
      </div>
      <input type="password" placeholder="••••••••" required />
    </div>

    <div class="form-checkbox">
      <input type="checkbox" id="remember" />
      <label for="remember">Remember me on this device</label>
    </div>

    <button type="submit" class="btn-primary">Sign In</button>
  </form>

  <p class="auth-footer">
    Don't have an account? <a href="Customer_Registration.html" class="link-gold">Book Your First Session</a>
  </p>
</div>
</body>
</html>
